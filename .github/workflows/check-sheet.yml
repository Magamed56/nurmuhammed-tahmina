name: Check link preview
# Временная проверка: что видит робот WhatsApp по ссылке приглашения. Ветку удалим после проверки.
on:
  push:
    branches: [check-sheet]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch like WhatsApp
        run: |
          UA="WhatsApp/2.24.20.80 A"
          for P in "" "?g=Test"; do
            S="https://magamed56.github.io/nurmuhammed-tahmina/$P"
            echo "== PAGE $S"; curl -sS -A "$UA" -o page.html -w "http %{http_code} type %{content_type} size %{size_download} redirect %{redirect_url}\n" "$S"
            grep -o '<meta property="og:[^>]*>' page.html | head -8
          done
          IMG="https://magamed56.github.io/nurmuhammed-tahmina/assets/og.jpg"
          echo "== IMAGE"; curl -sS -A "$UA" -o og.jpg -w "http %{http_code} type %{content_type} size %{size_download}\n" "$IMG"; file og.jpg
          echo "== HEADERS"; curl -sSI -A "$UA" "$IMG" | head -20
          echo "== PAGES ROOT"; curl -sS -o /dev/null -w "http %{http_code}\n" "https://magamed56.github.io/nurmuhammed-tahmina/v1/"
